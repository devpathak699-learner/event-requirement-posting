# Render Blueprint for the API. Frontend is deployed separately on Vercel.
services:
  - type: web
    name: event-requirements-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false # set in the Render dashboard (MongoDB Atlas connection string)
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
